{% extends "layout.html" %}
{% block content %}

<h2 class="mb-4">Editar Fruta</h2>

<div class="card shadow-sm">
    <div class="card-header bg-warning">
        <strong>Modificar Datos</strong>
    </div>

    <div class="card-body">

        <form action="{{ url_for('frutas_actualizar', id=fruta[0]) }}"
              method="POST"
              class="row g-3">

            <div class="col-md-4">
                <label class="form-label">Nombre</label>
                <input type="text"
                       name="nombre"
                       value="{{ fruta[1] }}"
                       class="form-control"
                       required>
            </div>

            <div class="col-md-4">
                <label class="form-label">Tipo</label>
                <input type="text"
                       name="tipo"
                       value="{{ fruta[2] }}"
                       class="form-control"
                       required>
            </div>

            <div class="col-md-2">
                <label class="form-label">Tiempo (min)</label>
                <input type="number"
                       name="tiempo"
                       value="{{ fruta[3] }}"
                       class="form-control"
                       required>
            </div>

            <div class="col-md-2">
                <label class="form-label">Temperatura (°C)</label>
                <input type="number"
                       step="0.1"
                       name="temperatura"
                       value="{{ fruta[4] }}"
                       class="form-control"
                       required>
            </div>

            <div class="col-12 mt-3">
                <button class="btn btn-warning px-4">
                    Actualizar
                </button>

                <a href="{{ url_for('frutas') }}"
                   class="btn btn-secondary px-4">
                   Cancelar
                </a>
            </div>

        </form>

    </div>
</div>

{% endblock %}
